[project]
name = "cua-system"
version = "0.1.0"
description = "Computer-Use Automation System: LLM-driven discovery, recorded capability artifacts, deterministic replay, and human escalation for legacy back-office surfaces."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pydantic>=2.6,<3",
    "playwright>=1.42,<2",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=4.1,<5",
    "hypothesis>=6.100,<7",
    "jsonschema>=4.21,<5",
    "httpx2>=2.0,<3",  # required by starlette.testclient in the installed starlette
    "ruff>=0.4,<1",
    "mypy>=1.9,<2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: fast, no external I/O, no browser, no network",
    "integration: real Playwright browser against the local fake target app; LLM calls use a fixture/replay transcript client, never a live model",
    "e2e_live: exercises a real LLM provider against a live browser session; costs money/tokens, requires API keys, excluded from default CI run",
]
addopts = "-ra --strict-markers -q -m \"not e2e_live\""
filterwarnings = [
    "error",
    # Third-party internals whose own deprecated-alias usage we don't
    # control; our own code's warnings still fail the suite.
    "ignore::DeprecationWarning:playwright.*",
    "ignore::DeprecationWarning:anyio.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore:.*BlockingPortal.*:DeprecationWarning",
]

[tool.coverage.run]
# Playwright's sync API bridges into an internal asyncio loop via
# greenlet; without this, coverage.py loses trace visibility on the
# line right after a Playwright call (a known interaction, not a real
# gap) because the greenlet switch happens invisibly to the trace hook.
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
